        nav a {

        }

        nav a:hover {
            color: #22c55e;
        }

        .hero-label {
            color: #22c55e;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 64px;
            line-height: 1.1;

            font-size: 30px;

            color: #071a33;
            padding: 14px 26px;
            border-radius: 6px;
            font-weight: bold;
            margin-right: 10px;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            background: white;
        }

        .button-outline {
            display: inline-block;
            border: 2px solid white;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button-outline:hover {

        }

           SERVICES
