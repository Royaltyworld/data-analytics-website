<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Royal Data Solutions</title>

    <meta name="description"
          content="Royal Data Solutions helps businesses turn data into better decisions.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #222;
            background: #f5f7fa;
        }

        /* NAVIGATION */

        nav {
            background: #071a3d;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav h2 {
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #00d9ff;
        }

        /* HERO */

        .hero {
            min-height: 90vh;
            background: linear-gradient(
                rgba(7, 26, 61, 0.9),
                rgba(0, 74, 173, 0.85)
            );

            color: white;
            display: flex;
            align-items: center;
            padding: 60px 8%;
        }

        .hero-content {
            max-width: 750px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .hero h3 {
            font-size: 25px;
            color: #00d9ff;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 19px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #00d9ff;
            color: #071a3d;
            padding: 14px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-right: 10px;
        }

        .button:hover {
            background: white;
        }

        /* SECTIONS */

        section {
            padding: 80px 8%;
        }

        section h2 {
            text-align: center;
            font-size: 35px;
            margin-bottom: 40px;
            color: #071a3d;
        }

        /* SERVICES */

        .services {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
